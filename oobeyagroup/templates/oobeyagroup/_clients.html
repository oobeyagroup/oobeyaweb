{% load static %}
<section class="py-lg-6 py-5">
    <div class="container">
        <h2 class="text-center display-6 fs-2 mb-5">Organizations we&rsquo;ve helped</h2>
        <div class="row align-items-center justify-content-center g-5">
            {% for client in clients %}
            <div class="col-lg-2 col-md-4 col-6 text-center">
                <img src="{% static client.logo %}" alt="{{ client.name }}" class="img-fluid" style="max-height: 60px; filter: grayscale(100%); opacity: 0.8">
            </div>
            {% endfor %}
        </div>
    </div>
</section>
